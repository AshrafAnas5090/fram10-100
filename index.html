<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحليل عملات الفيوتشر الاحترافية - شريكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0b0e14; }
        .row-item { transition: all 0.2s ease; }
        .row-item:hover { background: #151b26; }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-2 sm:p-4 md:p-6">

    <div class="max-w-5xl mx-auto">
        <!-- شريط التحكم المدمج بصف واحد (الشموع + الفريم + الفوليوم + العملات الفعالة) -->
        <header class="bg-slate-900/90 backdrop-blur-md border border-slate-800 p-1.5 sm:p-2.5 rounded-2xl mb-3 grid grid-cols-4 gap-1 sm:gap-2 text-center items-center">
            
            <!-- 1. اختيار عدد الشموع -->
            <div class="flex items-center justify-center gap-0.5 sm:gap-1 bg-slate-950 px-1 sm:px-2 py-1.5 rounded-xl border border-slate-800/80">
                <span class="text-[10px] sm:text-xs text-slate-400">الشموع:</span>
                <select id="limitSelect" onchange="initDashboard()" class="bg-transparent text-amber-400 font-bold text-[11px] sm:text-sm focus:outline-none cursor-pointer">
                    <option value="10" class="bg-slate-900">10</option>
                    <option value="25" selected class="bg-slate-900">25</option>
                    <option value="50" class="bg-slate-900">50</option>
                    <option value="100" class="bg-slate-900">100</option>
                </select>
            </div>

            <!-- 2. الفريم الزمني -->
            <div class="flex items-center justify-center gap-0.5 sm:gap-1 bg-slate-950 px-1 sm:px-2 py-1.5 rounded-xl border border-slate-800/80">
                <span class="text-[10px] sm:text-xs text-slate-400">الفريم:</span>
                <select id="timeframeSelect" onchange="initDashboard()" class="bg-transparent text-emerald-400 font-bold text-[11px] sm:text-sm focus:outline-none cursor-pointer">
                    <option value="1m" class="bg-slate-900">1m</option>
                    <option value="5m" class="bg-slate-900">5m</option>
                    <option value="15m" selected class="bg-slate-900">15m</option>
                    <option value="1h" class="bg-slate-900">1h</option>
                    <option value="4h" class="bg-slate-900">4h</option>
                    <option value="1d" class="bg-slate-900">1d</option>
                </select>
            </div>

            <!-- 3. الفوليوم -->
            <div class="flex items-center justify-center gap-0.5 sm:gap-1 bg-slate-950 px-1 sm:px-2 py-1.5 rounded-xl border border-slate-800/80">
                <span class="text-[10px] sm:text-xs text-slate-400">الفوليوم:</span>
                <select id="volumeSelect" onchange="initDashboard()" class="bg-transparent text-cyan-400 font-bold text-[11px] sm:text-sm focus:outline-none cursor-pointer">
                    <option value="2000000" selected class="bg-slate-900">≥2M</option>
                    <option value="3000000" class="bg-slate-900">≥3M</option>
                    <option value="5000000" class="bg-slate-900">≥5M</option>
                    <option value="7000000" class="bg-slate-900">≥7M</option>
                    <option value="10000000" class="bg-slate-900">≥10M</option>
                </select>
            </div>

            <!-- 4. العملات الفعالة -->
            <div class="flex items-center justify-center gap-1 bg-amber-500/10 border border-amber-500/30 px-1 sm:px-2 py-1.5 rounded-xl shadow-inner">
                <span class="text-[10px] sm:text-xs text-amber-400/90 font-bold">العملات:</span>
                <span id="coinsCounter" class="text-xs sm:text-sm font-black text-amber-400">0</span>
            </div>

        </header>

        <!-- شريط التقدم -->
        <div id="progressContainer" class="bg-slate-900 border border-slate-800 p-3 rounded-2xl mb-3 hidden">
            <div class="flex justify-between text-xs text-slate-400 mb-2">
                <span id="progressText">جاري فحص العملات...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-amber-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- رؤوس الأعمدة -->
        <div class="grid grid-cols-5 px-2 md:px-4 py-2 text-[11px] md:text-xs font-bold text-slate-400 border-b border-slate-800 mb-2 bg-slate-900/50 rounded-xl">
            <div>العملة</div>
            <div class="text-center">السعر</div>
            <div class="text-center cursor-pointer hover:text-amber-400 transition select-none" onclick="sortData('volume')">
                الفوليوم <i id="sortVolumeIcon" class="fa-solid fa-sort ml-0.5"></i>
            </div>
            <div class="text-center cursor-pointer hover:text-amber-400 transition select-none" onclick="sortData('green')">
                صاعد <i id="sortGreenIcon" class="fa-solid fa-sort ml-0.5"></i>
            </div>
            <div class="text-left cursor-pointer hover:text-amber-400 transition select-none" onclick="sortData('red')">
                هابط <i id="sortRedIcon" class="fa-solid fa-sort ml-0.5"></i>
            </div>
        </div>

        <!-- قائمة العملات -->
        <div id="cryptoList" class="flex flex-col gap-2">
            <div class="text-center py-12 text-slate-500 animate-pulse">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-amber-500"></i>
                <p class="text-sm font-bold">جاري جلب وتصفية العملات...</p>
            </div>
        </div>
    </div>

    <script>
        let marketData = [];
        let currentSort = { field: null, direction: 'desc' };

        async function initDashboard() {
            const timeframe = document.getElementById('timeframeSelect').value;
            const limit = document.getElementById('limitSelect').value;
            const minVolume = parseFloat(document.getElementById('volumeSelect').value);
            
            const container = document.getElementById('cryptoList');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const progressPercent = document.getElementById('progressPercent');
            const counterEl = document.getElementById('coinsCounter');

            container.innerHTML = `
                <div class="text-center py-12 text-slate-500 animate-pulse">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-amber-500"></i>
                    <p class="text-sm font-bold">جاري جلب وتصفية العملات...</p>
                </div>
            `;
            counterEl.innerText = "0";

            try {
                const ticker24Res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
                const tickers24 = await ticker24Res.json();

                const filteredSymbols = [];
                const priceMap = {};
                const volumeMap = {};

                tickers24.forEach(t => {
                    const quoteVolume = parseFloat(t.quoteVolume || 0);
                    if (t.symbol.endsWith('USDT') && quoteVolume >= minVolume) {
                        filteredSymbols.push(t.symbol);
                        priceMap[t.symbol] = parseFloat(t.lastPrice);
                        volumeMap[t.symbol] = quoteVolume;
                    }
                });

                progressContainer.classList.remove('hidden');
                marketData = [];
                const batchSize = 10;

                for (let i = 0; i < filteredSymbols.length; i += batchSize) {
                    const batch = filteredSymbols.slice(i, i + batchSize);
                    
                    const batchPromises = batch.map(async (symbol) => {
                        try {
                            const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${timeframe}&limit=${limit}`);
                            const klines = await res.json();
                            
                            let greenCount = 0;
                            let redCount = 0;

                            klines.forEach(candle => {
                                const open = parseFloat(candle[1]);
                                const close = parseFloat(candle[4]);
                                if (close >= open) greenCount++;
                                else redCount++;
                            });

                            return {
                                symbol,
                                price: priceMap[symbol] || 0,
                                volume: volumeMap[symbol] || 0,
                                greenCount,
                                redCount,
                                success: true
                            };
                        } catch (e) {
                            return { symbol, success: false };
                        }
                    });

                    const results = await Promise.all(batchPromises);
                    marketData.push(...results.filter(r => r.success));

                    counterEl.innerText = marketData.length;

                    let progress = Math.min(100, Math.round(((i + batch.length) / filteredSymbols.length) * 100));
                    progressBar.style.width = `${progress}%`;
                    progressPercent.innerText = `${progress}%`;
                    progressText.innerText = `تم فحص ${Math.min(i + batch.length, filteredSymbols.length)} من أصل ${filteredSymbols.length} عملة`;

                    await new Promise(resolve => setTimeout(resolve, 50));
                }

                progressContainer.classList.add('hidden');
                
                if (currentSort.field) {
                    applySorting();
                } else {
                    renderList();
                }

            } catch (error) {
                console.error("خطأ في الاتصال:", error);
                container.innerHTML = `<div class="text-center py-10 text-rose-500 font-bold">حدث خطأ أثناء جلب البيانات. يرجى إعادة المحاولة.</div>`;
            }
        }

        function formatVolume(vol) {
            if (vol >= 1e9) return `$${(vol / 1e9).toFixed(2)}B`;
            if (vol >= 1e6) return `$${(vol / 1e6).toFixed(2)}M`;
            if (vol >= 1e3) return `$${(vol / 1e3).toFixed(2)}K`;
            return `$${vol.toFixed(2)}`;
        }

        function sortData(field) {
            if (currentSort.field === field) {
                currentSort.direction = currentSort.direction === 'desc' ? 'asc' : 'desc';
            } else {
                currentSort.field = field;
                currentSort.direction = 'desc';
            }
            applySorting();
        }

        function applySorting() {
            const field = currentSort.field;
            
            document.getElementById('sortGreenIcon').className = "fa-solid fa-sort ml-0.5";
            document.getElementById('sortRedIcon').className = "fa-solid fa-sort ml-0.5";
            document.getElementById('sortVolumeIcon').className = "fa-solid fa-sort ml-0.5";

            if (field) {
                let iconId = 'sortGreenIcon';
                if (field === 'red') iconId = 'sortRedIcon';
                if (field === 'volume') iconId = 'sortVolumeIcon';

                document.getElementById(iconId).className = currentSort.direction === 'desc' 
                    ? "fa-solid fa-arrow-down-long ml-0.5 text-amber-400" 
                    : "fa-solid fa-arrow-up-long ml-0.5 text-amber-400";

                marketData.sort((a, b) => {
                    let valA = field === 'volume' ? a.volume : a[field + 'Count'];
                    let valB = field === 'volume' ? b.volume : b[field + 'Count'];
                    return currentSort.direction === 'desc' ? valB - valA : valA - valB;
                });
            }
            renderList();
        }

        function renderList() {
            const container = document.getElementById('cryptoList');
            document.getElementById('coinsCounter').innerText = marketData.length;

            container.innerHTML = marketData.map(item => {
                let priceFormatted = item.price >= 1 ? item.price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : item.price.toFixed(5);

                return `
                    <div class="row-item grid grid-cols-5 items-center bg-slate-900 border border-slate-800/80 px-2 md:px-4 py-2.5 rounded-xl shadow-sm text-xs md:text-sm">
                        <!-- اسم العملة -->
                        <div class="flex items-center gap-1">
                            <span class="font-black text-slate-100 truncate">${item.symbol.replace('USDT', '')}</span>
                        </div>

                        <!-- السعر -->
                        <div class="text-center font-bold text-slate-300 text-[11px] md:text-sm">
                            $${priceFormatted}
                        </div>

                        <!-- الفوليوم 24 ساعة -->
                        <div class="text-center font-semibold text-cyan-400/90 text-[11px] md:text-sm">
                            ${formatVolume(item.volume)}
                        </div>

                        <!-- عدد الصاعد -->
                        <div class="text-center">
                            <span class="bg-emerald-950/50 border border-emerald-900/40 text-emerald-400 font-bold px-1.5 md:px-3 py-0.5 rounded-lg text-[11px] md:text-sm inline-block">
                                ${item.greenCount}↑
                            </span>
                        </div>

                        <!-- عدد الهابط -->
                        <div class="text-left">
                            <span class="bg-rose-950/50 border border-rose-900/40 text-rose-400 font-bold px-1.5 md:px-3 py-0.5 rounded-lg text-[11px] md:text-sm inline-block">
                                ${item.redCount}↓
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        initDashboard();
    </script>
</body>
</html>
